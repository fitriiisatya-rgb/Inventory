<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory FIFO Pro</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="login-screen" class="card" style="max-width:380px; margin:80px auto;">
    <div class="card-header"><div class="card-title">🔐 Inventory FIFO Pro — Login</div></div>
    <div id="login-alert"></div>
    <form id="login-form">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">Masuk</button>
    </form>
</div>

<div id="change-password-screen" class="card" style="max-width:420px; margin:80px auto; display:none;">
    <div class="card-header"><div class="card-title">🔑 Ganti Password Wajib</div></div>
    <div class="alert alert-warning">Akun ini dibuat dengan password sementara. Anda harus mengganti password sebelum dapat menggunakan sistem.</div>
    <div id="change-password-alert"></div>
    <form id="change-password-form">
        <div class="form-group">
            <label>Password Saat Ini (sementara)</label>
            <input type="password" id="change-password-current" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label>Password Baru (min. 8 karakter)</label>
            <input type="password" id="change-password-new" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary" id="change-password-submit" style="width:100%;">Ganti Password</button>
    </form>
</div>

<div id="app-shell" style="display:none;">
    <header class="app-header">
        <div class="app-logo">
            <div class="logo-icon">📦</div>
            <div class="logo-text">
                <h1>Inventory FIFO Pro</h1>
                <span>MySQL Backend — Production</span>
            </div>
        </div>
        <div class="header-right">
            <span class="header-badge" id="role-badge">-</span>
            <span class="user-chip">Login sebagai <b id="username-chip">-</b></span>
            <button class="btn btn-secondary btn-sm" id="logout-btn">Keluar</button>
        </div>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">🏠 Dashboard</button>
            <button class="tab-btn" data-tab="transaksi" data-require-permission="TRANSACTION_IN_CREATE,TRANSACTION_OUT_CREATE">📥 Transaksi</button>
            <button class="tab-btn" data-tab="transfer" data-require-permission="WAREHOUSE_TRANSFER_MANAGE">🚚 Transfer</button>
            <button class="tab-btn" data-tab="produksi" data-require-permission="PRODUCTION_MANAGE">🏭 Produksi</button>
            <button class="tab-btn" data-tab="opname" data-require-permission="STOCK_OPNAME_MANAGE">📋 Stok Opname</button>
            <button class="tab-btn" data-tab="laporan">📊 Laporan</button>
            <button class="tab-btn" data-tab="master">🗂️ Master Data</button>
            <button class="tab-btn" data-tab="import" data-require-role="ADMIN,SUPERADMIN">📤 Import</button>
            <button class="tab-btn" data-tab="audit" data-require-permission="AUDIT_LOG_VIEW">📜 Audit Log</button>
            <button class="tab-btn" data-tab="closing" data-require-role="ADMIN,SUPERADMIN">🔐 Tutup Buku</button>
        </div>
    </div>

    <main class="app-main">
        <div class="tab-content active" id="tab-dashboard"></div>
        <div class="tab-content" id="tab-transaksi"></div>
        <div class="tab-content" id="tab-transfer"></div>
        <div class="tab-content" id="tab-produksi"></div>
        <div class="tab-content" id="tab-opname"></div>
        <div class="tab-content" id="tab-laporan"></div>
        <div class="tab-content" id="tab-master"></div>
        <div class="tab-content" id="tab-import"></div>
        <div class="tab-content" id="tab-audit"></div>
        <div class="tab-content" id="tab-closing"></div>
    </main>

    <footer>Inventory FIFO Pro &mdash; PHP + MySQL backend. Environment Production.</footer>
</div>

<script src="assets/js/api-client.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/master.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/transactions.js"></script>
<script src="assets/js/transfers.js"></script>
<script src="assets/js/production.js"></script>
<script src="assets/js/stock-opname.js"></script>
<script src="assets/js/adjustments.js"></script>
<script src="assets/js/closing.js"></script>
<script src="assets/js/imports.js"></script>
<script src="assets/js/audit.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
